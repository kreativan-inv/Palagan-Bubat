<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palagan Bubat</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:black;
  color:white;
  font-family:'Cinzel', serif;
  overflow:hidden;
}

/* COVER */
#cover{
  position:fixed;
  width:100%;
  height:100vh;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:999;
}
#cover button{
  padding:15px 30px;
  background:gold;
  border:none;
  border-radius:30px;
  cursor:pointer;
}

/* SCENE */
.scene{
  position:absolute;
  width:100%;
  height:100%;
  opacity:0;
  transition:opacity 2s;
}
.active{opacity:1;}

/* BACKGROUND */
.bg{
  position:absolute;
  width:100%;
  height:100%;
  background-size:cover;
  background-position:center;
  filter:brightness(0.5);
}

/* TEXT */
.text{
  position:absolute;
  top:50%;
  width:100%;
  text-align:center;
  transform:translateY(-50%);
  font-size:28px;
  padding:0 20px;
}
.ending{
  top:auto;
  bottom:8%;
  transform:none;
}

/* BUTTON */
.btn{
  padding:14px 28px;
  background:linear-gradient(45deg,gold,#ffd700);
  border:none;
  border-radius:25px;
  cursor:pointer;
  font-size:16px;
  box-shadow:0 0 15px rgba(255,215,0,0.6);
}

/* RESPONSIVE */
@media(max-width:768px){
  .text{font-size:20px;}
}
</style>
</head>

<body>

<!-- COVER -->
<div id="cover">
  <h1 style="color:gold;">PALAGAN BUBAT</h1>
  <button onclick="start()">Buka Undangan</button>
</div>

<!-- AUDIO -->
<audio id="music" loop>
  <source src="./assets/audio/music.mp3">
</audio>

<!-- SCENE 1 -->
<div class="scene" id="s1">
  <div class="bg" style="background-image:url('./assets/img/bg1.jpeg')"></div>
  <div class="text">Di tanah Pasundan…</div>
</div>

<!-- SCENE 2 -->
<div class="scene" id="s2">
  <div class="bg" style="background-image:url('./assets/img/bg2.jpeg')"></div>
  <div class="text">Sebuah kisah besar kembali dihidupkan…</div>
</div>

<!-- SCENE 3 -->
<div class="scene" id="s3">
  <div class="bg" style="background-image:url('./assets/img/bg3.jpeg')"></div>
  <div class="text">Tentang kehormatan dan sejarah…</div>
</div>

<!-- SCENE 4 -->
<div class="scene" id="s4">
  <div class="bg" style="background-image:url('./assets/img/poster.jpeg');background-size:contain;background-color:black;"></div>
  <div class="text">PALAGAN BUBAT</div>
</div>

<!-- FINAL SCENE (NO FORM – DIRECT WA) -->
<div class="scene" id="s5">
  <div class="bg" style="background-image:url('./assets/img/bg2.jpeg')"></div>

  <div class="text ending">

    <div>
      13 Mei 2026<br>
      19.00 WIB<br>
      ISBI Bandung
    </div>

    <br><br>

    <button onclick="kirimWA()" class="btn">
      Konfirmasi via WhatsApp
    </button>

  </div>
</div>

<script>
function start(){
  document.getElementById("cover").style.display="none";
  document.getElementById("music").play().catch(()=>{});

  let s=["s1","s2","s3","s4","s5"];
  let i=0;

  function next(){
    if(i>0){
      document.getElementById(s[i-1]).classList.remove("active");
    }

    if(i<s.length){
      document.getElementById(s[i]).classList.add("active");

      if(i<s.length-1){
        i++;
        setTimeout(next,5000);
      }
    }
  }

  next();
}

/* DIRECT WHATSAPP */
function kirimWA(){
  let text = "Halo, saya ingin konfirmasi kehadiran untuk acara Palagan Bubat.";
  let url = "https://wa.me/62895368595060?text=" + encodeURIComponent(text);
  window.open(url, "_blank");
}
</script>

</body>
</html>
