<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palagan Bubat</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  background:black;
  color:white;
  font-family:'Cinzel', serif;
  overflow:hidden;
}

/* COVER */
#cover {
  position:fixed;
  width:100%;
  height:100vh;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:999;
}

#cover button {
  padding:15px 30px;
  background:gold;
  border:none;
  border-radius:30px;
  cursor:pointer;
}

/* SCENE */
.scene {
  position:absolute;
  width:100%;
  height:100%;
  opacity:0;
  transition:opacity 2s ease;
}

.active { opacity:1; }

/* BACKGROUND */
.bg {
  position:absolute;
  width:100%;
  height:100%;
  background-size:cover;
  background-position:center;
  filter:brightness(0.45);
  transform:scale(1.1);
}

/* TEXT */
.text {
  position:absolute;
  top:50%;
  width:100%;
  text-align:center;
  transform:translateY(-50%);
  font-size:28px;
  padding:0 20px;
}

/* ENDING */
.ending {
  top:auto;
  bottom:10%;
  transform:none;
}

/* FORM */
input, select, textarea {
  width:80%;
  padding:10px;
  margin:5px;
  border-radius:10px;
  border:none;
}

/* BUTTON */
.btn-glow {
  margin-top:10px;
  padding:12px 25px;
  background:gold;
  color:black;
  border-radius:20px;
  border:none;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- COVER -->
<div id="cover">
  <h1 style="color:gold;">PALAGAN BUBAT</h1>
  <button onclick="start()">Buka Undangan</button>
</div>

<!-- AUDIO -->
<audio id="music" loop>
  <source src="./assets/audio/music.mp3">
</audio>

<!-- SCENES -->
<div class="scene" id="s1">
  <div class="bg" style="background-image:url('./assets/img/bg1.jpeg')"></div>
  <div class="text">Di tanah Pasundan…</div>
</div>

<div class="scene" id="s2">
  <div class="bg" style="background-image:url('./assets/img/bg2.jpeg')"></div>
  <div class="text">Sebuah kisah besar kembali dihidupkan…</div>
</div>

<div class="scene" id="s3">
  <div class="bg" style="background-image:url('./assets/img/bg3.jpeg')"></div>
  <div class="text">Tentang kehormatan dan sejarah…</div>
</div>

<div class="scene" id="s4">
  <div class="bg" style="background-image:url('./assets/img/poster.jpeg'); background-size:contain; background-color:black;"></div>
  <div class="text">PALAGAN BUBAT</div>
</div>

<!-- RSVP SCENE -->
<div class="scene" id="s5">
  <div class="bg" style="background-image:url('./assets/img/bg2.jpeg')"></div>

  <div class="text ending">
    <div>
      13 Mei 2026<br>
      G.K Sunan Ambu ISBI Bandung
    </div>

    <br>

    <input type="text" id="nama" placeholder="Nama Anda">
    <select id="hadir">
      <option>Hadir</option>
      <option>Tidak Hadir</option>
    </select>
    <input type="number" id="jumlah" placeholder="Jumlah Orang">
    <textarea id="pesan" placeholder="Pesan"></textarea>

    <br>

    <button onclick="kirimRSVP()" class="btn-glow">
      Kirim Konfirmasi
    </button>
  </div>
</div>

<script>
function start(){
  document.getElementById("cover").style.display="none";
  document.getElementById("music").play().catch(()=>{});

  let scenes = ["s1","s2","s3","s4","s5"];
  let i = 0;

  function next(){
    if(i>0){
      document.getElementById(scenes[i-1]).classList.remove("active");
    }
    if(i < scenes.length){
      document.getElementById(scenes[i]).classList.add("active");

      if(i < scenes.length-1){
        i++;
        setTimeout(next, 5000);
      }
    }
  }

  next();
}

/* RSVP GOOGLE FORM */
function kirimRSVP(){
  let nama = document.getElementById("nama").value;
  let hadir = document.getElementById("hadir").value;
  let jumlah = document.getElementById("jumlah").value;
  let pesan = document.getElementById("pesan").value;

  let url = "https://forms.gle/UXv1yXFBwmJJAkQi6";

  let data = new FormData();
  data.append("entry.111111", nama);
  data.append("entry.222222", hadir);
  data.append("entry.333333", jumlah);
  data.append("entry.444444", pesan);

  fetch(url, {
    method: "POST",
    mode: "no-cors",
    body: data
  });

  alert("Terima kasih! Data berhasil dikirim.");
}
</script>

</body>
</html>
