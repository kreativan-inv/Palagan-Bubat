<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palagan Bubat</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:black;
  color:white;
  font-family:'Cinzel', serif;
  overflow:hidden;
}

#cover{
  position:fixed;
  width:100%;
  height:100vh;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:999;
}

#cover button{
  padding:15px 30px;
  background:gold;
  border:none;
  border-radius:30px;
}

.scene{
  position:absolute;
  width:100%;
  height:100%;
  opacity:0;
  transition:opacity 2s;
}
.active{opacity:1;}

.bg{
  position:absolute;
  width:100%;
  height:100%;
  background-size:cover;
  background-position:center;
  filter:brightness(0.5);
}

.text{
  position:absolute;
  top:50%;
  width:100%;
  text-align:center;
  transform:translateY(-50%);
  font-size:28px;
}

.ending{
  top:auto;
  bottom:5%;
  transform:none;
}

input,select,textarea{
  width:85%;
  max-width:400px;
  padding:10px;
  margin:6px;
  border-radius:10px;
  border:none;
}

.btn{
  padding:12px 25px;
  background:gold;
  border:none;
  border-radius:20px;
  cursor:pointer;
}

@media(max-width:768px){
  .text{font-size:20px;}
}
</style>
</head>

<body>

<div id="cover">
  <h1 style="color:gold;">PALAGAN BUBAT</h1>
  <button onclick="start()">Buka Undangan</button>
</div>

<audio id="music" loop>
  <source src="./assets/audio/music.mp3">
</audio>

<div class="scene" id="s1">
  <div class="bg" style="background-image:url('./assets/img/bg1.jpeg')"></div>
  <div class="text">Di tanah Pasundan…</div>
</div>

<div class="scene" id="s2">
  <div class="bg" style="background-image:url('./assets/img/bg2.jpeg')"></div>
  <div class="text">Sebuah kisah besar kembali dihidupkan…</div>
</div>

<div class="scene" id="s3">
  <div class="bg" style="background-image:url('./assets/img/bg3.jpeg')"></div>
  <div class="text">Tentang kehormatan dan sejarah…</div>
</div>

<div class="scene" id="s4">
  <div class="bg" style="background-image:url('./assets/img/poster.jpeg');background-size:contain;background-color:black;"></div>
  <div class="text">PALAGAN BUBAT</div>
</div>

<div class="scene" id="s5">
  <div class="bg" style="background-image:url('./assets/img/bg2.jpeg')"></div>

  <div class="text ending">

    <div>
      13 Mei 2026<br>
      19.00 WIB<br>
      ISBI Bandung
    </div>

    <br>

    <input id="nama" placeholder="Nama">
    <input id="asal" placeholder="Asal (Instansi)">
    <input id="contact" placeholder="Contact Person">

    <select id="hadir">
      <option value="">Pilih Kehadiran</option>
      <option>Hadir</option>
      <option>Tidak Hadir</option>
    </select>

    <textarea id="pesan" placeholder="Pesan (Optional)"></textarea>

    <button onclick="kirimRSVP()" class="btn">
      Kirim
    </button>

  </div>
</div>

<script>
function start(){
  document.getElementById("cover").style.display="none";
  document.getElementById("music").play().catch(()=>{});

  let s=["s1","s2","s3","s4","s5"];
  let i=0;

  function next(){
    if(i>0){
      document.getElementById(s[i-1]).classList.remove("active");
    }

    if(i<s.length){
      document.getElementById(s[i]).classList.add("active");

      if(i<s.length-1){
        i++;
        setTimeout(next,5000);
      }
    }
  }

  next();
}

/* RSVP KE GOOGLE SHEET */
function kirimRSVP(){
  let nama=document.getElementById("nama").value;
  let asal=document.getElementById("asal").value;
  let contact=document.getElementById("contact").value;
  let hadir=document.getElementById("hadir").value;
  let pesan=document.getElementById("pesan").value;

  if(nama===""||asal===""||contact===""||hadir===""){
    alert("Mohon lengkapi data!");
    return;
  }

  fetch("https://script.google.com/macros/s/AKfycbzL_E3pT3J7QL_nJvmi4WIWU5b5a_aP7QDg2mrAACG_gGoGPrdhgWfT9jVyUHP58aGjjg/exec",{
    method:"POST",
    body: JSON.stringify({
      nama:nama,
      asal:asal,
      contact:contact,
      hadir:hadir,
      pesan:pesan
    }),
    headers:{
      "Content-Type":"application/json"
    }
  })
  .then(()=>alert("Berhasil dikirim!"))
  .catch(()=>alert("Gagal kirim!"));

}
</script>

</body>
</html>
