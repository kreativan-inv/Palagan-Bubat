<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palagan Bubat</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  background:black;
  color:white;
  font-family:'Cinzel', serif;
  overflow:hidden;
}

/* COVER */
#cover {
  position:fixed;
  width:100%;
  height:100vh;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:999;
}

#cover button {
  padding:15px 30px;
  background:gold;
  border:none;
  border-radius:30px;
  cursor:pointer;
}

/* SCENE */
.scene {
  position:absolute;
  width:100%;
  height:100%;
  opacity:0;
  transition:opacity 2s ease;
}

.active { opacity:1; }

/* BACKGROUND */
.bg {
  position:absolute;
  width:100%;
  height:100%;
  background-size:cover;
  background-position:center;
  filter:brightness(0.45);
  transform:scale(1.1);
}

/* TEXT */
.text {
  position:absolute;
  top:50%;
  width:100%;
  text-align:center;
  transform:translateY(-50%);
  font-size:28px;
  padding:0 20px;
  text-shadow:0 0 20px black;
}

/* ENDING */
.ending {
  top:auto;
  bottom:8%;
  transform:none;
}

/* FORM */
input, select, textarea {
  width:85%;
  max-width:400px;
  padding:10px;
  margin:6px;
  border-radius:10px;
  border:none;
  outline:none;
}

/* BUTTON */
.btn-glow {
  margin-top:10px;
  padding:12px 25px;
  background:linear-gradient(45deg,gold,#ffd700);
  color:black;
  border-radius:20px;
  border:none;
  cursor:pointer;
  box-shadow:0 0 15px rgba(255,215,0,0.6);
}

/* MOBILE */
@media (max-width:768px){
  .text { font-size:20px; }
}
</style>
</head>

<body>

<!-- COVER -->
<div id="cover">
  <h1 style="color:gold;">PALAGAN BUBAT</h1>
  <button onclick="start()">Buka Undangan</button>
</div>

<!-- AUDIO -->
<audio id="music" loop>
  <source src="./assets/audio/music.mp3">
</audio>

<!-- SCENES -->
<div class="scene" id="s1">
  <div class="bg" style="background-image:url('./assets/img/bg1.jpeg')"></div>
  <div class="text">Di tanah Pasundan…</div>
</div>

<div class="scene" id="s2">
  <div class="bg" style="background-image:url('./assets/img/bg2.jpeg')"></div>
  <div class="text">Sebuah kisah besar kembali dihidupkan…</div>
</div>

<div class="scene" id="s3">
  <div class="bg" style="background-image:url('./assets/img/bg3.jpeg')"></div>
  <div class="text">Tentang kehormatan dan sejarah…</div>
</div>

<div class="scene" id="s4">
  <div class="bg" style="background-image:url('./assets/img/poster.jpeg'); background-size:contain; background-color:black;"></div>
  <div class="text">PALAGAN BUBAT</div>
</div>

<!-- RSVP FINAL -->
<div class="scene" id="s5">
  <div class="bg" style="background-image:url('./assets/img/bg2.jpeg')"></div>

  <div class="text ending">

    <div style="font-size:22px;">
      13 Mei 2026<br>
      19.00 WIB<br>
      G.K Sunan Ambu ISBI Bandung
    </div>

    <div style="margin-top:10px; font-style:italic;">
      Kami menantikan kehadiran Anda
    </div>

    <br>

    <input type="text" id="nama" placeholder="Nama">

    <input type="text" id="asal" placeholder="Asal (Instansi, dll)">

    <input type="text" id="contact" placeholder="Contact Person">

    <select id="hadir">
      <option value="">-- Pilih Kehadiran --</option>
      <option value="Hadir">Hadir</option>
      <option value="Tidak Hadir">Tidak Hadir</option>
    </select>

    <textarea id="pesan" placeholder="Pesan (Optional)"></textarea>

    <br>

    <button onclick="kirimRSVP()" class="btn-glow">
      Kirim Konfirmasi
    </button>

  </div>
</div>

<script>
function start(){
  document.getElementById("cover").style.display="none";
  document.getElementById("music").play().catch(()=>{});

  let scenes = ["s1","s2","s3","s4","s5"];
  let i = 0;

  function next(){
    if(i>0){
      document.getElementById(scenes[i-1]).classList.remove("active");
    }
    if(i < scenes.length){
      document.getElementById(scenes[i]).classList.add("active");

      if(i < scenes.length-1){
        i++;
        setTimeout(next, 5000);
      }
    }
  }

  next();
}

/* RSVP GOOGLE FORM */
function kirimRSVP(){
  let nama = document.getElementById("nama").value;
  let asal = document.getElementById("asal").value;
  let contact = document.getElementById("contact").value;
  let hadir = document.getElementById("hadir").value;
  let pesan = document.getElementById("pesan").value;

  if(nama === "" || asal === "" || contact === "" || hadir === ""){
    alert("Mohon lengkapi semua data wajib!");
    return;
  }

  let url = "https://docs.google.com/forms/d/e/1FAIpQLScPLG-0qHTuQaM-I3-wT_SBdRf1aopQlla0bYP6Q51kFh2Qww/formResponse";

  let data = new FormData();
  data.append("entry.2063437378", nama);
  data.append("entry.121974123", asal);
  data.append("entry.1203427236", contact);
  data.append("entry.186602110", hadir);
  data.append("entry.entry.605305232", pesan);

  fetch(url, {
    method: "POST",
    mode: "no-cors",
    body: data
  });

  alert("Terima kasih! Konfirmasi berhasil dikirim.");

  document.getElementById("nama").value="";
  document.getElementById("asal").value="";
  document.getElementById("contact").value="";
  document.getElementById("hadir").value="";
  document.getElementById("pesan").value="";
}
</script>

</body>
</html>
